<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Chess — Chess Scenes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="find-page">

  <header class="site-header">
    <div class="header-chess-bg"></div>
    <div class="header-inner">
      <span class="king-icon">♟</span>
      <div class="header-title">
        <h1>Chess Scenes</h1>
        <div class="subtitle">Find chess everywhere</div>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn btn-ghost">Map</a>
        <a href="index.html#suggest" class="btn btn-ink">Suggest a place</a>
      </div>
    </div>
  </header>

  <div class="find-search-wrap">
    <div class="find-search-inner">
      <h2 class="find-title">Find chess</h2>
      <p class="find-subtitle">Pick a city. Add a date to see what's on that night — events first, then where you can always play.</p>
      <form class="find-form" id="find-form" autocomplete="off">
        <div class="find-fields">
          <input
            type="text"
            id="find-city"
            class="find-input"
            placeholder="City, e.g. London"
            autocomplete="off"
            inputmode="search"
          />
          <input
            type="date"
            id="find-date"
            class="find-input"
            title="Optional — leave blank to see all venues"
          />
          <button type="submit" class="btn btn-gold find-btn">Search</button>
        </div>
      </form>
    </div>
  </div>

  <div class="find-body">
    <div id="find-results"></div>
  </div>

  <footer class="find-footer">
    <a href="index.html">← Map</a>
    <span>© Chess Scenes</span>
    <a href="index.html#suggest">Suggest a place</a>
  </footer>

  <script type="module" src="js/find.js"></script>
</body>
</html>
