<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checked in — Max Euweplein</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .card {
    text-align: center;
    padding: 2rem;
    max-width: 360px;
  }
  .board {
    font-size: 3rem;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 0.5rem;
  }
  p {
    color: #aaa;
    font-size: 0.95rem;
    line-height: 1.4;
  }
  #time {
    color: #fff;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="board">♟️</div>
    <h1 id="heading">Checked in at Max Euweplein</h1>
    <p>Someone's playing right now.<br>
    <span id="time"></span></p>
  </div>
  <script>
    document.getElementById('time').textContent =
      new Date().toLocaleString('en-GB', {
        weekday: 'short', hour: '2-digit', minute: '2-digit'
      });

    const params = new URLSearchParams(window.location.search);
    const table = params.get('table');
    if (table) {
      document.getElementById('heading').textContent =
        `Checked in at Max Euweplein — Table ${table}`;
    }
  </script>
</body>
</html>
